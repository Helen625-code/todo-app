<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow â€” Smart Productivity & Task Management</title>
    <meta name="description" content="TaskFlow is a modern, fast, and responsive vanilla JavaScript to-do application designed for focused productivity.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- App Header -->
    <header class="app-header">
        <div class="header-container">
            <div class="logo-group">
                <div class="logo-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m9 11 3 3L22 4"></path>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="app-title">TaskFlow</h1>
                    <p class="app-subtitle">Simple tasks. Better productivity.</p>
                </div>
            </div>

            <div class="header-actions">
                <button id="theme-toggle-btn" class="icon-btn" title="Toggle Dark/Light Mode" aria-label="Toggle theme">
                    <!-- Sun Icon (Light) -->
                    <svg id="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2"></path>
                        <path d="M12 20v2"></path>
                        <path d="m4.93 4.93 1.41 1.41"></path>
                        <path d="m17.66 17.66 1.41 1.41"></path>
                        <path d="M2 12h2"></path>
                        <path d="M20 12h2"></path>
                        <path d="m6.34 17.66-1.41 1.41"></path>
                        <path d="m19.07 4.93-1.41 1.41"></path>
                    </svg>
                    <!-- Moon Icon (Dark) -->
                    <svg id="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Wrapper -->
    <main class="main-wrapper">

        <!-- Stats Ribbon -->
        <section class="stats-grid" aria-label="Productivity statistics">
            <div class="stat-card total">
                <div class="stat-header">
                    <span class="stat-label">Total Tasks</span>
                    <svg class="stat-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M8 8h8"/><path d="M8 16h5"/></svg>
                </div>
                <div class="stat-value" id="stat-total">0</div>
            </div>

            <div class="stat-card active">
                <div class="stat-header">
                    <span class="stat-label">In Progress</span>
                    <svg class="stat-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <div class="stat-value" id="stat-active">0</div>
            </div>

            <div class="stat-card done">
                <div class="stat-header">
                    <span class="stat-label">Completed</span>
                    <svg class="stat-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                </div>
                <div class="stat-value" id="stat-completed">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">Progress</span>
                    <span id="stat-rate-text" class="stat-label" style="color: var(--primary);">0%</span>
                </div>
                <div class="progress-track">
                    <div id="stat-progress-bar" class="progress-fill"></div>
                </div>
            </div>
        </section>

        <!-- Main Task Management Card -->
        <div class="app-card">

            <!-- Task Input Section -->
            <div class="task-form-wrapper">
                <form id="add-task-form" class="task-form">
                    <div class="task-input-row">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <input type="text" id="task-title-input" class="main-input" placeholder="What needs to be done? (Press 'N' to focus)" autocomplete="off" required>
                    </div>

                    <div class="task-meta-row">
                        <div class="meta-controls">
                            <!-- Priority Selector -->
                            <select id="task-priority-select" class="select-chip" title="Task Priority">
                                <option value="medium">âš¡ Medium Priority</option>
                                <option value="high">ðŸ”¥ High Priority</option>
                                <option value="low">ðŸŒ± Low Priority</option>
                            </select>

                            <!-- Category Selector -->
                            <select id="task-category-select" class="select-chip" title="Task Category">
                                <option value="Work">ðŸ’¼ Work</option>
                                <option value="Personal">ðŸ  Personal</option>
                                <option value="Project">ðŸš€ Project</option>
                                <option value="Urgent">âš ï¸ Urgent</option>
                                <option value="Ideas">ðŸ’¡ Ideas</option>
                            </select>

                            <!-- Due Date Picker -->
                            <input type="date" id="task-due-date" class="date-chip" title="Due Date">
                        </div>

                        <button type="submit" class="submit-btn" id="add-task-btn">
                            <span>Add Task</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Toolbar & Search/Filters -->
            <div class="toolbar">
                <div class="search-row">
                    <div class="search-box">
                        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        <input type="text" id="search-input" class="search-input" placeholder="Search tasks by keyword... (Press '/' to search)">
                        <button id="search-clear-btn" class="search-clear-btn" title="Clear search">âœ•</button>
                    </div>
                    <span class="kbd-badge" title="Shortcut to search">/</span>
                </div>

                <div class="filter-row">
                    <!-- Status Filter Pills -->
                    <div class="status-pill-group" id="status-filters">
                        <button class="filter-pill active" data-filter="all">All</button>
                        <button class="filter-pill" data-filter="active">Active</button>
                        <button class="filter-pill" data-filter="completed">Completed</button>
                    </div>

                    <!-- Category & Sort Dropdowns -->
                    <div class="sort-group">
                        <select id="filter-category-select" class="sort-select" title="Filter by Category">
                            <option value="all">All Categories</option>
                            <option value="Work">Work</option>
                            <option value="Personal">Personal</option>
                            <option value="Project">Project</option>
                            <option value="Urgent">Urgent</option>
                            <option value="Ideas">Ideas</option>
                        </select>

                        <select id="sort-select" class="sort-select" title="Sort Tasks">
                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                            <option value="priority">Priority (High to Low)</option>
                            <option value="due-date">Due Date</option>
                            <option value="alphabetical">Alphabetical (A-Z)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Task List Container -->
            <div id="task-list" class="task-list">
                <!-- Injected dynamically by app.js -->
            </div>

            <!-- Empty State Container -->
            <div id="empty-state" class="empty-state" style="display: none;">
                <div class="empty-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <line x1="10" y1="9" x2="8" y2="9"></line>
                    </svg>
                </div>
                <h3 id="empty-title" class="empty-title">No tasks found</h3>
                <p id="empty-desc" class="empty-desc">Create a new task above or adjust your search filters to see your work.</p>
            </div>

            <!-- Footer Toolbar / Bulk Actions -->
            <div class="footer-toolbar">
                <span id="task-count-summary" class="task-summary-text">Showing 0 tasks</span>
                <div class="bulk-actions-group">
                    <button id="btn-clear-completed" class="text-btn danger" title="Remove all completed tasks">Clear Completed</button>
                    <button id="btn-mark-all-done" class="text-btn" title="Mark all current tasks as done">Mark All Done</button>
                    <button id="btn-export-json" class="text-btn" title="Export tasks to JSON file">Export JSON</button>
                    <label class="text-btn" style="cursor: pointer;" title="Import tasks from JSON file">
                        Import JSON
                        <input type="file" id="import-file-input" accept=".json" style="display: none;">
                    </label>
                </div>
            </div>

        </div>

    </main>

    <!-- Task Edit & Detail Modal -->
    <div id="task-modal" class="modal-overlay" aria-hidden="true" role="dialog">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Edit Task</h3>
                <button id="modal-close-btn" class="modal-close-btn" aria-label="Close modal">âœ•</button>
            </div>
            <form id="modal-edit-form" class="modal-form">
                <input type="hidden" id="modal-task-id">

                <div class="form-group">
                    <label class="form-label" for="modal-task-title">Task Title</label>
                    <input type="text" id="modal-task-title" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="modal-task-notes">Description / Notes</label>
                    <textarea id="modal-task-notes" class="form-textarea" rows="3" placeholder="Add extra details, notes, or links..."></textarea>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                    <div class="form-group">
                        <label class="form-label" for="modal-task-priority">Priority</label>
                        <select id="modal-task-priority" class="form-select">
                            <option value="high">ðŸ”¥ High</option>
                            <option value="medium">âš¡ Medium</option>
                            <option value="low">ðŸŒ± Low</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="modal-task-category">Category</label>
                        <select id="modal-task-category" class="form-select">
                            <option value="Work">ðŸ’¼ Work</option>
                            <option value="Personal">ðŸ  Personal</option>
                            <option value="Project">ðŸš€ Project</option>
                            <option value="Urgent">âš ï¸ Urgent</option>
                            <option value="Ideas">ðŸ’¡ Ideas</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="modal-task-due">Due Date</label>
                    <input type="date" id="modal-task-due" class="form-input">
                </div>

                <div class="modal-footer">
                    <button type="button" id="modal-cancel-btn" class="text-btn">Cancel</button>
                    <button type="submit" class="submit-btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- App Footer -->
    <footer class="app-footer">
        <p class="footer-copy">TaskFlow â€” Built with HTML5, Vanilla CSS &amp; Pure JavaScript</p>
    </footer>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
